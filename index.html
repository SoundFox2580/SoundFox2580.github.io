<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刻墓斯 · 全自动作品墙</title>
    <style>
        /* ... (样式部分与之前保持一致，为节省篇幅此处省略) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #f8fafc;
            padding: 24px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .studio-name {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2a3a 0%, #2d3e50 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #5a6874; margin-top: 8px; border-bottom: 1px solid #e2e8f0; display: inline-block; padding-bottom: 8px; }
        .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
        .work-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }
        .work-card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15); }
        .cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #eef2ff;
        }
        .info { padding: 16px 18px 20px; flex: 1; }
        .title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .author {
            font-size: 0.8rem;
            color: #f97316;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .author::before { content: "✧"; font-size: 12px; }
        .loading-state, .error-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 32px;
            color: #475569;
        }
        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="studio-name">✧ 刻墓斯 · 创想工坊 ✧</div>
        <div class="subtitle">✨ 新作品自动同步 · 一次配置永久更新 ✨</div>
    </div>
    <div id="worksContainer" class="works-grid">
        <div class="loading-state">🚀 正在加载成员最新作品...</div>
    </div>
    <div class="footer">💡 提示：作品墙会实时同步已配置成员的最新公开作品</div>
</div>

<script>
    // ======================= 🎯 只需要修改这一个地方 =======================
    // 把你和所有朋友的编程猫用户ID填进这个数组
    // 如何获取用户ID？访问个人主页，网址中 https://shequ.codemao.cn/user/ 后面的数字就是ID
    const memberIds = [
        1234415,
        521780
    ];

    // 每个成员最多拉取多少个作品
    const WORKS_PER_USER = 6;
    // ==================================================================

    // 工具：简单的防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 获取单个成员的作品列表
    async function fetchWorksByUserId(userId) {
        const url = `https://shequ.codemao.cn/api/community/work/user/${userId}?page=1&size=${WORKS_PER_USER}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            
            let works = [];
            if (data.items && Array.isArray(data.items)) works = data.items;
            else if (data.works && Array.isArray(data.works)) works = data.works;
            else if (data.data && Array.isArray(data.data)) works = data.data;
            else if (Array.isArray(data)) works = data;

            return works.map(work => ({
                id: work.id,
                title: work.name || work.title || '未命名作品',
                cover: work.cover_url || work.cover || 'https://static.codemao.cn/whitef/favicon.ico', // 默认图片
                url: `https://shequ.codemao.cn/work/${work.id}`,
                authorName: work.nickname || work.author_name || '工作室成员',
                userId: userId,
                createTime: work.created_at || work.publish_time || null
            }));
        } catch (err) {
            console.error(`获取用户 ${userId} 作品失败:`, err);
            return [];
        }
    }

    // 获取所有成员的作品
    async function fetchAllWorks() {
        const allWorksPromises = memberIds.map(uid => fetchWorksByUserId(uid));
        const worksArrays = await Promise.all(allWorksPromises);
        let allWorks = worksArrays.flat();

        // 去重
        const uniqueMap = new Map();
        allWorks.forEach(work => {
            if (!uniqueMap.has(work.id)) {
                uniqueMap.set(work.id, work);
            }
        });
        allWorks = Array.from(uniqueMap.values());

        // 按作品ID倒序排序 (ID越大通常越新)
        allWorks.sort((a, b) => b.id - a.id);
        return allWorks;
    }

    // 渲染作品墙
    function renderWorks(works) {
        const container = document.getElementById('worksContainer');
        if (!works.length) {
            container.innerHTML = '<div class="empty-state">📭 暂无作品，请先配置成员ID或等待成员发布作品。</div>';
            return;
        }

        container.innerHTML = works.map(work => `
            <a class="work-card" href="${work.url}" target="_blank" rel="noopener noreferrer">
                <img class="cover" src="${work.cover}" alt="${escapeHtml(work.title)}" loading="lazy" onerror="this.src='https://static.codemao.cn/whitef/favicon.ico'">
                <div class="info">
                    <div class="title">${escapeHtml(work.title)}</div>
                    <div class="author">${escapeHtml(work.authorName)}</div>
                </div>
            </a>
        `).join('');
    }

    // 启动
    async function init() {
        const container = document.getElementById('worksContainer');
        if (memberIds.length === 0) {
            container.innerHTML = '<div class="error-state">⚠️ 请先在代码中配置工作室成员的用户ID！</div>';
            return;
        }
        try {
            const works = await fetchAllWorks();
            renderWorks(works);
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="error-state">⚠️ 加载失败，请检查网络或稍后重试。</div>';
        }
    }

    init();
</script>
</body>
</html>
